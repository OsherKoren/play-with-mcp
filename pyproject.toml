[project]
name = "expense_tracker_mcp_server"
version = "0.1.0"
description = "A server for tracking expenses using MCP."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.12.4",
]

[dependency-groups]
quality = [
    "black>=25.9.0",
    "isort>=6.1.0",
    "jsonschema>=4.25.1",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pylint>=3.3.9",
]
test = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[tool.isort]
profile = "black"
src_paths = ["expense_tracker_mcp_server"]
honor_noqa = true

[tool.pylint]
#ignore-paths = "./expense_tracker_mcp_server/tests"
fail-under = '9.0'
